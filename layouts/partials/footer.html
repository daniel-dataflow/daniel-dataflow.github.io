<!-- Mermaid.js for Architecture & Flowchart Diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof mermaid !== "undefined") {
    mermaid.initialize({
      startOnLoad: true,
      theme: "default",
      securityLevel: "loose",
      fontFamily: "Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif"
    });

    // Support code blocks highlighted by Hugo Chroma (code.language-mermaid)
    const chromaBlocks = document.querySelectorAll('code.language-mermaid, code[data-lang="mermaid"], pre.chroma code.language-mermaid');
    chromaBlocks.forEach(function (codeBlock) {
      const container = codeBlock.closest(".highlight") || codeBlock.closest("pre");
      if (container) {
        const rawText = codeBlock.textContent.trim();
        const chartWrapper = document.createElement("div");
        chartWrapper.className = "mermaid";
        chartWrapper.textContent = rawText;
        container.parentNode.insertBefore(chartWrapper, container);
        container.remove();
        try {
          mermaid.run({ nodes: [chartWrapper] });
        } catch (e) {
          console.warn("Mermaid render error:", e);
        }
      }
    });
  }
});
</script>
