<!-- ─── 이메일 난독화 해제 스크립트 (Central – email_btn.html 과 연동) ───
     HTML 소스에는 data-user / data-domain 만 존재하며,
     클릭 시점에 JS가 mailto: 링크를 조립합니다.
     스크래퍼·스팸봇은 이메일 주소를 수집할 수 없습니다.
─────────────────────────────────────────────────────────────────────── -->
<script>
(function () {
  function assembleEmail(el) {
    var u = el.dataset.user;
    var d = el.dataset.domain;
    if (u && d) {
      el.href = 'mailto:' + u + '@' + d;
    }
  }
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a.nb-email-link').forEach(function (el) {
      // 호버 시 미리 조립 (접근성 향상)
      el.addEventListener('mouseenter', function () { assembleEmail(el); });
      el.addEventListener('focus',      function () { assembleEmail(el); });
      // 클릭 시 조립 후 바로 이동
      el.addEventListener('click', function (e) {
        e.preventDefault();
        assembleEmail(el);
        if (el.href && el.href !== '#') {
          window.location.href = el.href;
        }
      });
    });
  });
})();
</script>

<!-- Mermaid.js for Architecture & Flowchart Diagrams -->
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  if (typeof mermaid !== "undefined") {
    mermaid.initialize({
      startOnLoad: true,
      theme: "default",
      securityLevel: "loose",
      fontFamily: "Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif"
    });

    // Support code blocks highlighted by Hugo Chroma (code.language-mermaid)
    const chromaBlocks = document.querySelectorAll('code.language-mermaid, code[data-lang="mermaid"], pre.chroma code.language-mermaid');
    chromaBlocks.forEach(function (codeBlock) {
      const container = codeBlock.closest(".highlight") || codeBlock.closest("pre");
      if (container) {
        const rawText = codeBlock.textContent.trim();
        const chartWrapper = document.createElement("div");
        chartWrapper.className = "mermaid";
        chartWrapper.textContent = rawText;
        container.parentNode.insertBefore(chartWrapper, container);
        container.remove();
        try {
          mermaid.run({ nodes: [chartWrapper] });
        } catch (e) {
          console.warn("Mermaid render error:", e);
        }
      }
    });
  }
});
</script>
