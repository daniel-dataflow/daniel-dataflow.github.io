<!DOCTYPE html>
<html lang="ko">
<head>
  {{ partial "head.html" . }}
</head>
<body class="nb-body">
  {{ partial "header.html" . }}

  <div class="nb-layout-container">
    <!-- 모바일 / 태블릿 전용 상단 요약 바 (프로필 요약 & 카테고리 칩 슬라이더 & 검색) -->
    {{ partial "mobile_top_summary.html" . }}

    <div class="nb-layout-grid">
      <!-- 좌측 사이드바 (데스크톱에서는 좌측 사이드바 표시) -->
      {{ partial "sidebar.html" . }}

      <!-- 본문 영역 -->
      <main class="nb-main-content" id="main-content">
        {{ block "main" . }}{{ end }}
      </main>
    </div>
  </div>

  {{ partial "footer.html" . }}
</body>
</html>
