baseURL: "https://daniel-dataflow.github.io/"
languageCode: "ko-kr"
title: "Daniel Tech Log"
theme: "PaperMod"

paginate: 8

params:
  env: production
  title: "Daniel Tech Log"
  description: "PickSafe 아키텍처 및 기술 의사결정 아카이브"
  author: "Daniel"
  defaultTheme: auto
  disableThemeToggle: false

  # ❌ 휑하던 프로필 모드 끄기 ➔ 메인 접속 시 바로 최신 글 목록 출력
  profileMode:
    enabled: false

  # 기사 카드 옵션 및 기능 활성화
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true
  TocOpen: true

# 상단 메뉴바 (카테고리/태그 바로가기)
menu:
  main:
    - identifier: picksafe
      name: "PickSafe DevLog"
      url: /posts/picksafe/
      weight: 10
    - identifier: tags
      name: "Tags"
      url: /tags/
      weight: 20
    - identifier: categories
      name: "Categories"
      url: /categories/
      weight: 30
    - identifier: search
      name: "Search"
      url: /search/
      weight: 40
