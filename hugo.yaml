baseURL: "/"
languageCode: "ko-kr"
title: "Daniel Tech Blog"

pagination:
  pagerSize: 8

outputs:
  home:
    - HTML
    - RSS
    - JSON

taxonomies:
  category: categories
  categories: categories
  tag: tags
  tags: tags

params:
  env: production
  title: "Daniel Tech Blog"
  banner_badge: "Engineering & Architecture Archive"
  subtitle: "아키텍처 및 백엔드 엔지니어링 아카이브"
  description: "고성능 백엔드 아키텍처, 시스템 최적화, 그리고 실전 엔지니어링 문제 해결 기록소"
  author: "Daniel"
  author_role: "Backend & Systems Architect"
  author_bio: "초고속 응답 시스템 설계와 확장 가능한 데이터 파이프라인을 구축합니다. 기술적 의사결정의 이유와 Trade-off를 깊이 있게 기록합니다."
  author_avatar: "/images/profile.jpg"
  banner_image: "/images/banner.jpg"
  portfolio_url: "https://daniel-profile-site.vercel.app"
  github_url: "https://github.com/daniel-dataflow"
  email: "daniel.han.developer@gmail.com"

  # 네이버 블로그 위젯 설정
  widgets:
    show_profile: true
    show_categories: true
    show_recent_posts: true
    show_tags: true
    show_search: true

  # 포스트 설정
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: true
  ShowToc: true

# 상단 GNB 메뉴바 (카테고리 전체보기로 단일화하여 모든 카테고리 균등 대우)
menu:
  main:
    - identifier: home
      name: "홈"
      url: /
      weight: 10
    - identifier: categories
      name: "카테고리"
      url: /categories/
      weight: 20
    - identifier: tags
      name: "태그 모음"
      url: /tags/
