baseURL: "https://daniel-dataflow.github.io/"
languageCode: "ko"
title: "Daniel Tech"
theme: "blowfish"

params:
  colorScheme: "blowfish" # 깔끔한 모던 블루/화이트 톤
  defaultBackgroundImage: "img/default-banner.png"
  
  # 네이버 D2 스타일의 메인 레이아웃 세팅
  homepage:
    layout: "custom"
    showHero: true
    heroStyle: "big" # 상단 넓은 배너
    showRecent: true
    showRecentItems: 6
    cardView: true # 카드형 목록

  # 우측 사이드바 활성화
  article:
    showTableOfContents: true
    showAuthor: true
